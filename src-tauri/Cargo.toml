[package]
name = "agentszone"
version = "0.1.0"
description = "AgentsZone - AI-native collaboration desktop app"
authors = ["AgentsZone"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "agentszone"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agentszone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentszone"
path = "src/main.rs"

[[bin]]
name = "az-bridge"
path = "src/bin/az_bridge.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tauri = { version = "2.10.3", features = [], optional = true }
tauri-plugin-log = { version = "2", optional = true }
keyring = { version = "3", optional = true }
thiserror = "2"
regex = "1"
mime_guess = "2"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-log", "dep:rusqlite", "dep:keyring", "dep:tauri-build"]
